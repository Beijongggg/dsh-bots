name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 全量回归（preflight ①门口径：TMPDIR=/dev/shm；真宿主面由本地 ④门把守）
        run: TMPDIR=/dev/shm node tests/run.mjs
      - name: 冻结面与 lint（preflight ②③门）
        run: node scripts/ci-gates.mjs
